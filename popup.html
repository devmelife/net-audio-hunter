<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #0f172a; color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      width: 420px; height: 500px; margin: 0; display: flex; flex-direction: column;
    }
    .header {
      padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155;
      display: flex; align-items: center; justify-content: space-between;
    }
    .status-badge {
      font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 99px;
      background: #334155; color: #94a3b8; display: flex; align-items: center; gap: 6px;
    }
    .status-badge.active { background: #064e3b; color: #34d399; }
    .status-badge.active::before {
      content: ""; width: 6px; height: 6px; background: #10b981; border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
    .item {
      padding: 14px 16px; border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; gap: 12px; transition: background 0.2s;
    }
    .item:hover { background: #1e293b; }
    .info { flex: 1; min-width: 0; }
    .filename { font-size: 13px; font-weight: 600; color: #f8fafc; margin-bottom: 2px; }
    .url { font-size: 10px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; }
    .actions { display: flex; gap: 8px; }
    .btn {
      background: #334155; border: none; color: #f1f5f9;
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn:hover { background: #3b82f6; }
    .btn.playing { background: #10b981; }
    svg { width: 18px; height: 18px; fill: currentColor; }
    .empty { padding: 40px; text-align: center; color: #64748b; font-size: 13px; }
    .switch { position: relative; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #334155; border-radius: 20px; transition: .4s; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .4s; }
    input:checked + .slider { background: #3b82f6; }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <div class="header">
    <div id="badge" class="status-badge">OFFLINE</div>
    <div style="display:flex; gap:12px; align-items:center;">
      <label class="switch"><input type="checkbox" id="toggle"><span class="slider"></span></label>
      <button id="clear" style="background:none; border:none; color:#ef4444; font-size:10px; font-weight:bold; cursor:pointer;">CLEAR</button>
    </div>
  </div>
  <ul class="list" id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
